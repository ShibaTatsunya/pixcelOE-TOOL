<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pixcelOE 1.5.0-alpha.1 · 图片转像素图（单文件版）</title>
<style>
:root{--bg:#0c0e13;--panel:#14161c;--panel2:#1a1d25;--line:#232833;--fg:#e6e8ee;--fg2:#8a90a0;--accent:#7c6cff;--accent2:#a99bff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif}
.layout{display:grid;grid-template-columns:318px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100vh}
.panel{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding-bottom:16px}
.stage{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;background:linear-gradient(45deg,#0f1116 25%,transparent 25%,transparent 75%,#0f1116 75%),linear-gradient(45deg,#0f1116 25%,#14161c 25%,#14161c 75%,#0f1116 75%);background-size:22px 22px;background-position:0 0,11px 11px}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 14px;background:rgba(20,23,30,.95);border-bottom:1px solid var(--line)}
.topbar h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.3px}
.topbar .sub{color:var(--fg2);font-size:12px}
.topbar-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px}
.btn:hover{background:#232733}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent}
.stage-toolbar{display:flex;align-items:center;gap:14px;padding:9px 14px;background:rgba(20,23,30,.92);border-bottom:1px solid var(--line);flex-wrap:wrap}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:transparent;color:var(--fg2);border:none;padding:6px 11px;cursor:pointer;font-size:12.5px}
.seg button.on{background:var(--accent);color:#fff}
.chk{display:flex;align-items:center;gap:6px;color:var(--fg2);font-size:12.5px;cursor:pointer;user-select:none}
.chk input{accent-color:var(--accent)}
.canvas-wrap{flex:1;position:relative;overflow:auto;display:grid;place-items:center;padding:22px;min-height:0}
.drop-hint{color:var(--fg2);text-align:center;padding:40px}
.drop-hint .drop-icon{font-size:42px;margin-bottom:8px}
.drop-hint b{color:var(--fg)}
.hint-sub{font-size:12px;margin-top:10px}
.views{display:flex;gap:16px;align-items:center}
.view{position:relative;line-height:0}
.view img{display:block;image-rendering:pixelated;max-width:none}
.tag{pointer-events:none;position:absolute;left:4px;top:4px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:2px 6px;border-radius:4px;display:none}
.views.result #view-original{display:none}
.views.original #view-result{display:none}
.views.original #view-original .tag,.views.split #view-original .tag{display:block}
.views.result #view-result .tag{display:block}
.grid-overlay{position:absolute;inset:0;pointer-events:none;z-index:3}
.busy{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:12px;background:rgba(12,14,19,.62);z-index:6;color:var(--fg2)}
.spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stage-status{display:flex;gap:16px;padding:7px 14px;background:rgba(20,23,30,.95);border-top:1px solid var(--line);color:var(--fg2);font-size:12px;flex-wrap:wrap}
.stage-status .ok{color:#5ecf8a}
.stage-status .bad{color:#ef6a6a}
.group{border-bottom:1px solid #232833;padding:10px 15px 14px}
.group:last-child{border-bottom:none}
.step-toggle{display:flex;align-items:center;gap:8px;margin:0 0 10px;cursor:pointer;user-select:none}
.step-toggle input{accent-color:var(--accent);width:14px;height:14px;flex:0 0 auto}
.step-toggle span{font-size:11.5px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--accent2)}
.group.off .field{opacity:.35;pointer-events:none}
.field{margin-bottom:12px}
.field:last-child{margin-bottom:0}
.field-top{display:flex;justify-content:space-between;margin-bottom:5px}
.field-top label{font-size:13px;color:var(--fg)}
.val{color:var(--accent2);font-size:12.5px;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
select{width:100%;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px;font-size:13px}
.help{font-size:11.5px;color:var(--fg2);margin-top:4px}
.chk .help{display:none}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#232733;border:1px solid var(--line);color:var(--fg);padding:9px 16px;border-radius:8px;z-index:9;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="layout">
  <aside class="panel">
    <div class="topbar">
      <h1>pixcelOE</h1><span class="sub">1.5.0-alpha.1 · 单文件版</span>
      <div class="topbar-actions">
        <button id="btn-save-preset" class="btn ghost" title="把当前参数存为预设">保存预设</button>
        <button id="btn-reset" class="btn ghost" title="恢复默认参数">重置</button>
      </div>
    </div>
    <div class="group">
      <label class="chk" style="margin-bottom:8px">
        <select id="preset">
          <option value="character">角色预设</option>
          <option value="scene">场景预设</option>
        </select>
      </label>
      <div id="controls"></div>
    </div>
  </aside>

  <section class="stage">
    <div class="stage-toolbar">
      <div class="seg" id="view-mode">
        <button data-v="result" class="on">成品</button>
        <button data-v="original">原图</button>
        <button data-v="split">并排</button>
      </div>
      <div class="seg" id="zoom">
        <button data-z="fit" class="on">适应</button>
        <button data-z="1">1x</button>
        <button data-z="2">2x</button>
        <button data-z="4">4x</button>
        <button data-z="8">8x</button>
      </div>
      <label class="chk"><input type="checkbox" id="chk-grid"> 像素网格</label>
      <div class="topbar-actions" style="margin-left:auto">
        <button id="btn-batch" class="btn ghost" title="批量导出多张图">批量导出</button>
        <button id="btn-export" class="btn primary" disabled>导出 PNG</button>
      </div>
    </div>

    <div class="canvas-wrap" id="canvas-wrap">
      <div id="drop-hint" class="drop-hint">
        <div class="drop-icon">⬆</div>
        <p><b>把图片拖到这里</b>，或</p>
        <button class="btn primary" id="btn-pick">选择图片</button>
        <p class="hint-sub">支持 PNG / JPG / WEBP，建议用大图（如 640×960）</p>
        <input type="file" id="file" accept="image/*" multiple hidden>
      </div>
      <div id="views" class="views hidden">
        <div class="view" id="view-original"><img id="img-original" alt="原图"></div>
        <div class="view" id="view-result"><img id="img-result" alt="成品"></div>
      </div>
      <div id="busy" class="busy hidden"><div class="spinner"></div><span>转换中…</span></div>
    </div>

    <div class="stage-status">
      <span id="st-size">—</span>
      <span id="st-time">—</span>
      <span id="st-check">—</span>
      <span id="st-warn" class="bad"></span>
    </div>
  </section>
</div>
<div id="toast"></div>

<script id="pipeline-code">
/* ============================ 调色板 ============================ */
const PALETTE = {
  gray: {
    character: { hex: ["#0F0F0F","#232323","#3A3A3A","#565656","#787878","#9E9E9E","#CACACA","#F2F2F2"] },
    scene: { hex: ["#000000","#282828","#5F5F5F","#919191","#B9B9B9","#DCDCDC","#FFFFFF"] }
  }
};
function hexToRgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function grayRgb(kind){return PALETTE.gray[kind].hex.map(hexToRgb);}
function narrowPalette(pal, levels){
  const n=pal.length;
  if(levels<=0||levels>=n) return pal.slice();
  if(levels===1)return [pal[0]];
  const out=[];
  for(let i=0;i<levels;i++){const idx=roundEven(i*(n-1)/(levels-1));out.push(pal[idx]);}
  return out;
}
function roundEven(v){const lo=Math.floor(v);return v-lo===0.5?(lo%2===0?lo:lo+1):Math.round(v);}
function posterizeSteps(levels, mode, pal){
  if(levels===1)levels=2;
  if(levels&&mode==='ps'){const step=255/(levels-1);const out=[];for(let i=0;i<levels;i++)out.push(roundEven(i*step));return out;}
  if(!pal) pal=grayRgb('character');
  let vals=pal.map(c=>c[0]);
  if(levels&&levels!==vals.length){const lo=Math.min(...vals),hi=Math.max(...vals);vals=[];for(let i=0;i<levels;i++)vals.push(roundEven(lo+(hi-lo)*i/(levels-1)));}
  return [...new Set(vals.map(v=>Math.round(v)))].sort((a,b)=>a-b);
}

/* ============================ 图像工具 ============================ */
const f32=Math.fround;
function lum709(r,g,b){return f32(f32(f32(f32(0.2126)*r)+f32(f32(0.7152)*g))+f32(f32(0.0722)*b));}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function rgb2gray(rgb){const n=rgb.length/3;const g=new Float32Array(n);for(let i=0;i<n;i++){const o=i*3;g[i]=f32(0.2126*rgb[o]+0.7152*rgb[o+1]+0.0722*rgb[o+2]);}return g;}

/* Quickselect avoids allocating and sorting a JS array for every source pixel. */
let medianScratch=new Float32Array(256);
function medCount(vals,n){
  if(medianScratch.length<n)medianScratch=new Float32Array(n);
  const a=medianScratch;a.set(vals.subarray(0,n));const mid=n>>1;
  let left=0,right=n-1;
  while(left<right){
    const pivot=a[(left+right)>>1];let i=left,j=right;
    while(i<=j){while(a[i]<pivot)i++;while(a[j]>pivot)j--;if(i<=j){const v=a[i];a[i++]=a[j];a[j--]=v;}}
    if(mid<=j)right=j;else if(mid>=i)left=i;else break;
  }
  if(n%2)return a[mid];
  let lower=-Infinity;for(let i=0;i<mid;i++)if(a[i]>lower)lower=a[i];
  return f32(f32(lower+a[mid])/2);
}

/* 窗口 (2r+1)² 的 min/max/median（边缘复制） */
function localStat(gray,h,w,r){
  const mn=new Float32Array(h*w),mx=new Float32Array(h*w),md=new Float32Array(h*w);
  const N=(2*r+1)*(2*r+1);
  const buf=new Float32Array(N);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    let k=0,lo=255,hi=0;
    for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
      const yy=clamp(y+dy,0,h-1),xx=clamp(x+dx,0,w-1);
      const v=gray[yy*w+xx];buf[k++]=v;if(v<lo)lo=v;if(v>hi)hi=v;
    }
    mn[y*w+x]=lo;mx[y*w+x]=hi;md[y*w+x]=medCount(buf,N);
  }
  return [mn,mx,md];
}

/* 腐蚀(min)/膨胀(max) */
function morph(gray,h,w,r,mode){
  const out=gray.slice();
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    let v=mode==='min'?255:0;
    for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
      const yy=clamp(y+dy,0,h-1),xx=clamp(x+dx,0,w-1);
      const t=gray[yy*w+xx];
      v=mode==='min'?Math.min(v,t):Math.max(v,t);
    }
    out[y*w+x]=v;
  }
  return out;
}

/* 对比度感知轮廓扩展 */
function outlineExpand(gray,h,w,patch,thickness,keepThin){
  const [mn,mx,med]=localStat(gray,h,w,patch);
  const bright=new Float32Array(h*w),dark=new Float32Array(h*w);
  for(let i=0;i<h*w;i++){bright[i]=Math.fround(Math.max(0,Math.fround(mx[i]-med[i])));dark[i]=Math.fround(Math.max(0,Math.fround(med[i]-mn[i])));}
  let wmax=0;
  const wt=new Float32Array(h*w);
  for(let i=0;i<h*w;i++){const w1=Math.fround(Math.fround(1-Math.fround(med[i]/255))*bright[i]);const w2=Math.fround(Math.abs(Math.fround(bright[i]-dark[i])));wt[i]=Math.fround(w1+w2);if(wt[i]>wmax)wmax=wt[i];}
  for(let i=0;i<h*w;i++)wt[i]=wmax>0?Math.fround(wt[i]/f32(wmax+1e-6)):0;
  const eroded=morph(gray,h,w,thickness,'min');
  const dilated=morph(gray,h,w,thickness,'max');
  const blended=new Float32Array(h*w);
  for(let i=0;i<h*w;i++)blended[i]=Math.fround(Math.fround(wt[i]*dilated[i])+Math.fround(f32(1-wt[i])*eroded[i]));
  let closed=morph(morph(blended,h,w,1,'max'),h,w,1,'min');
  if(keepThin)return closed;
  return morph(morph(closed,h,w,1,'min'),h,w,1,'max');
}

/* 轮廓扩展 + 彩色保持，返回 [expandedRgb(Uint8Clamped), gray] */
function expandOnly(rgb,h,w,patch,thickness,keepThin){
  const gray=rgb2gray(rgb);
  const expanded=outlineExpand(gray,h,w,patch,thickness,keepThin);
  const out=new Float32Array(h*w*3);
  for(let i=0;i<h*w;i++){
    const o=i*3;
    const ratio=clamp(Math.fround(expanded[i]/Math.max(gray[i],1.0)),0,4);
    out[o]=clamp(f32(rgb[o]*ratio),0,255);
    out[o+1]=clamp(f32(rgb[o+1]*ratio),0,255);
    out[o+2]=clamp(f32(rgb[o+2]*ratio),0,255);
  }
  return [out,gray];
}

/* ============================ 去饱和 / 分档 / 明暗 ============================ */
function desaturateAdjust(rgb,h,w,desat,brightness,contrast){
  const lum=new Float32Array(h*w);
  const k=contrast?((259*(contrast+255))/(255*(259-contrast))):1;
  for(let i=0;i<h*w;i++){
    const o=i*3,r=rgb[o],g=rgb[o+1],b=rgb[o+2];
    let l=desat==='hsl'?Math.fround((Math.max(r,g,b)+Math.min(r,g,b))*0.5):lum709(r,g,b);
    if(brightness)l=Math.fround(l+brightness);
    if(contrast)l=f32(f32(f32(k)*f32(l-128))+128);
    lum[i]=clamp(l,0,255);
  }
  return lum;
}

function posterizeLum(lum,h,w,levels,mode,steps){
  const out=new Uint8ClampedArray(h*w*3);
  for(let i=0;i<h*w;i++){
    let g;
    if(mode==='ps'&&levels&&levels>=2){
      let idx=Math.floor(lum[i]*levels/256);
      idx=clamp(idx,0,steps.length-1);
      g=steps[idx];
    }else{
      let best=0,bd=1e9;
      for(let s=0;s<steps.length;s++){const d=Math.abs(lum[i]-steps[s]);if(d<bd){bd=d;best=s;}}
      g=steps[best];
    }
    const o=i*3;out[o]=g;out[o+1]=g;out[o+2]=g;
  }
  return out;
}

function adjustColor(rgb,h,w,brightness,contrast){
  const out=new Uint8ClampedArray(h*w*3);
  const k=contrast?((259*(contrast+255))/(255*(259-contrast))):1;
  for(let i=0;i<h*w;i++){
    const o=i*3,r=rgb[o],g=rgb[o+1],b=rgb[o+2];
    let l0=(Math.max(r,g,b)+Math.min(r,g,b))*0.5;
    let l=l0;
    if(brightness)l=f32(l+brightness);
    if(contrast)l=f32(f32(f32(k)*f32(l-128))+128);
    l=clamp(l,0,255);
    const ratio=l0>0?f32(l/Math.max(l0,1e-6)):1;
    out[o]=Math.trunc(clamp(f32(r*ratio),0,255));out[o+1]=Math.trunc(clamp(f32(g*ratio),0,255));out[o+2]=Math.trunc(clamp(f32(b*ratio),0,255));
  }
  return out;
}

/* ============================ LAB ============================ */
function srgbToLinear(c){return c<=f32(0.04045)?f32(c/f32(12.92)):f32(Math.pow(f32(f32(c+f32(0.055))/f32(1.055)),f32(2.4)));}
function linearToSrgb(c){return c<=f32(0.0031308)?f32(f32(12.92)*c):f32(f32(f32(1.055)*f32(Math.pow(Math.max(c,0),f32(1/2.4))))-f32(0.055));}
function labF(t){const d=6/29;return t>f32(d*d*d)?f32(Math.cbrt(t)):f32(f32(t/f32(3*d*d))+f32(4/29));}
function labFinv(t){const d=6/29;return t>f32(d)?f32(Math.pow(t,3)):f32(f32(3*d*d)*f32(t-f32(4/29)));}
function dot3(a,b,c,x,y,z){return f32(f32(f32(f32(a)*x)+f32(f32(b)*y))+f32(f32(c)*z));}
function rgbToLab(rgb,h,w){
  const lab=new Float32Array(h*w*3);
  for(let i=0;i<h*w;i++){
    const o=i*3;
    const r=srgbToLinear(f32(rgb[o]/255)),g=srgbToLinear(f32(rgb[o+1]/255)),b=srgbToLinear(f32(rgb[o+2]/255));
    const x=dot3(0.412453,0.357580,0.180423,r,g,b);
    const y=dot3(0.212671,0.715160,0.072169,r,g,b);
    const z=dot3(0.019334,0.119193,0.950227,r,g,b);
    const fx=labF(f32(x/f32(0.95047))),fy=labF(y),fz=labF(f32(z/f32(1.08883)));
    lab[o]=f32(f32(116*fy)-16);lab[o+1]=f32(500*f32(fx-fy));lab[o+2]=f32(200*f32(fy-fz));
  }
  return lab;
}
function labToRgb(lab,h,w){
  const rgb=new Uint8ClampedArray(h*w*3);
  for(let i=0;i<h*w;i++){
    const o=i*3,L=lab[o],A=lab[o+1],B=lab[o+2];
    const fy=f32(f32(L+16)/116),fx=f32(fy+f32(A/500)),fz=f32(fy-f32(B/200));
    const x=f32(f32(0.95047)*labFinv(fx)),y=labFinv(fy),z=f32(f32(1.08883)*labFinv(fz));
    let r=dot3(3.240479,-1.537150,-0.498535,x,y,z);
    let g=dot3(-0.969256,1.875992,0.041556,x,y,z);
    let b=dot3(0.055648,-0.204043,1.057311,x,y,z);
    rgb[o]=Math.trunc(clamp(f32(linearToSrgb(r)*255),0,255));
    rgb[o+1]=Math.trunc(clamp(f32(linearToSrgb(g)*255),0,255));
    rgb[o+2]=Math.trunc(clamp(f32(linearToSrgb(b)*255),0,255));
  }
  return rgb;
}

/* Hue-preserving HSL lightness layers + optional lightness dither. */
const BAYER={
  bayer4:[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]],
  bayer8:[[0,32,8,40,2,34,10,42],[48,16,56,24,50,18,58,26],[12,44,4,36,14,46,6,38],[60,28,52,20,62,30,54,22],[3,35,11,43,1,33,9,41],[51,19,59,27,49,17,57,25],[15,47,7,39,13,45,5,37],[63,31,55,23,61,29,53,21]]
};
function quantizeColor(rgb,h,w,colorLevels,grayLevels,dither,ditherStrength){
  const out=new Uint8ClampedArray(h*w*3),m=BAYER[dither];
  const clv=Math.max(2,colorLevels),glv=Math.max(2,grayLevels);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const o=(y*w+x)*3;
    const r=f32(rgb[o]/255),g=f32(rgb[o+1]/255),b=f32(rgb[o+2]/255);
    const hi=Math.max(r,g,b),lo=Math.min(r,g,b),base=f32(f32(hi+lo)*0.5);
    let lightness=base;
    if(m){const t=m[y%m.length][x%m[0].length]/(m.length*m[0].length)-0.5;
      lightness=clamp(f32(lightness+f32(t*f32(ditherStrength/255))),0,1);}
    const k=f32(hi-lo)>f32(8/255)?clv:glv;
    const target=f32(clamp(Math.floor(lightness*k+0.5)/k,0,1));
    writeLightness(out,o,r,g,b,base,target);
  }
  return out;
}
function writeLightness(out,o,r,g,b,base,target){
  const span=Math.min(base,f32(1-base)),targetSpan=Math.min(target,f32(1-target));
  const scale=span>0?f32(targetSpan/span):0;
  out[o]=roundEven(f32(clamp(f32(f32(f32(r-base)*scale)+target),0,1)*255));
  out[o+1]=roundEven(f32(clamp(f32(f32(f32(g-base)*scale)+target),0,1)*255));

function refreshAccentOverlay(){
  const editing=accentTool&&['paint','erase'].includes(accentTool.mode)&&state.view==='original';
  if(!editing){if(accentPaintOverlay)accentPaintOverlay.style.display='none';return;}
  const img=document.getElementById('img-original'),r=img.getBoundingClientRect();
  if(!accentPaintOverlay){accentPaintOverlay=document.createElement('canvas');accentPaintOverlay.style.cssText='position:fixed;pointer-events:none;z-index:8';document.body.append(accentPaintOverlay);}
  const cv=accentPaintOverlay;cv.width=img.naturalWidth;cv.height=img.naturalHeight;
  Object.assign(cv.style,{display:'block',left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});
  const ctx=cv.getContext('2d'),rule=(state.params.accent_rules||[])[accentTool.index];
  const strokes=[...(rule?.paint_mask?.strokes||[])];if(accentDrag?.stroke)strokes.push(accentDrag.stroke);
  for(const stroke of strokes){
    ctx.globalCompositeOperation=stroke.erase?'destination-out':'source-over';ctx.strokeStyle=ctx.fillStyle='#c040ff88';
    ctx.lineWidth=stroke.radius*Math.min(cv.width,cv.height)*2;ctx.lineCap=ctx.lineJoin='round';
    const pts=stroke.points;if(!pts.length)continue;
    if(pts.length===1){ctx.beginPath();ctx.arc(pts[0][0]*cv.width,pts[0][1]*cv.height,ctx.lineWidth/2,0,Math.PI*2);ctx.fill();}
    else{ctx.beginPath();ctx.moveTo(pts[0][0]*cv.width,pts[0][1]*cv.height);for(const p of pts.slice(1))ctx.lineTo(p[0]*cv.width,p[1]*cv.height);ctx.stroke();}
  }
}

function installAccentSelection(){

function buildField(it){
  const wrap=document.createElement('div');wrap.className='field';wrap.dataset.k=it.k;
  const v=state.params[it.k];
  if(it.t==='bool'){
    const lab=document.createElement('label');lab.className='chk';
    const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!v;
    cb.addEventListener('change',()=>{if(it.k==='color_mode'&&cb.checked)state.params.selective_mode=false;setParam(it.k,cb.checked);if(it.k==='color_mode')buildControls();});
    lab.appendChild(cb);lab.appendChild(document.createTextNode(' '+it.label));
    wrap.appendChild(lab);if(it.help)wrap.appendChild(helpEl(it.help));return wrap;
  }
  const top=document.createElement('div');top.className='field-top';
  const lab=document.createElement('label');lab.textContent=it.label;top.appendChild(lab);
  if(it.t==='range'){
    const val=document.createElement('span');val.className='val';
    const disp=it.logbase?(Math.log(v)/Math.log(it.logbase)):v;
    val.textContent=fmt(v);top.appendChild(val);wrap.appendChild(top);

  }

    sel.value=v;sel.addEventListener('change',()=>setParam(it.k,sel.value));

}
function helpEl(t){const d=document.createElement('div');d.className='help';d.textContent=t;return d;}
function setParam(k,v){state.params[k]=v;scheduleRender();}
let renderTimer=null;

/* ============================ 渲染 ============================ */
let worker=null,workerBusy=false,workerSource=null,renderRevision=0,renderPending=false;
let renderWaiters=[],uploadRevision=0;
function ensureWorker(){
  if(worker)return;
  const source=document.getElementById('pipeline-code').textContent+`
    let sourceRgb;
    self.onmessage=({data:m})=>{
      try{
        if(m.rgb)sourceRgb=m.rgb;
        const t0=performance.now(),r=convert(sourceRgb,m.h,m.w,m.params);
        self.postMessage({...r,revision:m.revision,ms:Math.round(performance.now()-t0)},[r.final.buffer]);
      }catch(e){self.postMessage({revision:m.revision,error:e.message});}
    };`;
  const url=URL.createObjectURL(new Blob([source],{type:'text/javascript'}));
  try{worker=new Worker(url);}finally{URL.revokeObjectURL(url);}
  worker.onmessage=({data:r})=>{
    workerBusy=false;
    if(r.revision===renderRevision){
      if(r.error){state.finalData=null;$('#st-warn').textContent=r.error;toast('转换失败：'+r.error);}
      else commitRender(r);
    }
    if(renderPending)dispatchRender();
    else{
      $('#busy').classList.add('hidden');
      $('#btn-export').disabled=!state.finalData;
      const waiters=renderWaiters;renderWaiters=[];waiters.forEach(resolve=>resolve(!r.error));
    }
  };
  worker.onerror=e=>{
    worker.terminate();worker=null;workerBusy=false;workerSource=null;renderPending=false;state.finalData=null;
    $('#busy').classList.add('hidden');$('#st-warn').textContent='后台计算失败，请重新调整参数';
    const waiters=renderWaiters;renderWaiters=[];waiters.forEach(resolve=>resolve(false));
    toast(e.message||'后台计算失败');
  };
}
function dispatchRender(){
  if(workerBusy||!renderPending)return;
  try{
    ensureWorker();
    const message={revision:renderRevision,h:state.srcH,w:state.srcW,params:{...state.params}};
    if(workerSource!==state.srcData){message.rgb=state.srcData;workerSource=state.srcData;}
    workerBusy=true;renderPending=false;worker.postMessage(message);
  }catch(e){
    workerBusy=false;renderPending=false;$('#busy').classList.add('hidden');toast('无法启动计算：'+e.message);
    const waiters=renderWaiters;renderWaiters=[];waiters.forEach(resolve=>resolve(false));
  }
}
function renderNow(){
  clearTimeout(renderTimer);renderTimer=null;
  if(!state.srcData)return Promise.resolve(false);
  renderRevision++;renderPending=true;
  $('#busy').classList.remove('hidden');$('#btn-export').disabled=true;
  const promise=new Promise(resolve=>renderWaiters.push(resolve));
  dispatchRender();return promise;
}
function commitRender(r){
  state.outW=r.outW;state.outH=r.outH;state.finalData=r.final;
  const img=$('#img-result');
  img.width=state.outW;img.height=state.outH;
  const cv=toCanvas(r.final,state.outW,state.outH);
  img.src=cv.toDataURL();
  $('#st-size').textContent=`${state.srcW}×${state.srcH} → ${state.outW}×${state.outH}`;
  $('#st-time').textContent=`耗时 ${r.ms}ms`;
  state.report=validateOutput(r.final,state.params);
  const passed=state.report.checks.filter(c=>c.pass).length,total=state.report.checks.length;
  $('#st-check').textContent=`验收 ${state.report.pass?'✓':'✗'} ${passed}/${total}`;
  $('#st-check').className=state.report.pass?'ok':'bad';
  $('#st-check').title=state.report.checks.map(c=>`${c.label}：${c.detail}`).join('\n');
  $('#st-warn').textContent='';
  applyView();
}
function validateOutput(data,p){
  const allowed=new Set(grayRgb(p.palette_kind).map(c=>c.join(',')));
  const accents=new Set((p.selective_mode?(p.accent_rules||[]):[]).filter(r=>r.enabled!==false).flatMap(r=>grayRgb(p.palette_kind).map(g=>Array.from(accentShade(accentRGB(r.target),g)).join(','))));
  let outside=0,colorPixels=0,unregistered=0;const colors=new Map();
  for(let i=0;i<data.length;i+=3){
    const c=[data[i],data[i+1],data[i+2]],key=c.join(',');colors.set(key,(colors.get(key)||0)+1);
    if(!allowed.has(key)&&!accents.has(key))outside++;
    if(Math.max(...c)-Math.min(...c)>8){colorPixels++;if(!accents.has(key))unregistered++;}
  }
  const checks=[
    {name:'alpha',label:'边缘无半透明',pass:true,detail:'输出 alpha 全部为 255'},
    {name:'palette',label:'用色符合灰阶与抽色规则',pass:outside===0,detail:`灰阶之外 ${outside} 像素`},
    {name:'hardness',label:'无杂色',pass:unregistered===0,detail:`非指定彩色 ${unregistered} 像素；抽色 ${colorPixels} 像素`}
  ];
  return {pass:checks.every(c=>c.pass),checks,details:{unique_colors:colors.size,accent_pixels:colorPixels,accent_ratio:colorPixels/(data.length/3),
    colors:[...colors].map(([rgb,px])=>({rgb:rgb.split(',').map(Number),px}))}};
}

/* ============================ 上传 ============================ */
async function upload(file){
  if(!file)return false;
  const revision=++uploadRevision;let bmp;
  try{
    if(file.size>64*1024*1024)throw new Error('图片超过 64 MB');
    bmp=await createImageBitmap(file);
    if(revision!==uploadRevision)return false;
    if(bmp.width*bmp.height>40000000)throw new Error('图片超过 4000 万像素');
    const cv=document.createElement('canvas');cv.width=bmp.width;cv.height=bmp.height;
    const ctx=cv.getContext('2d');ctx.drawImage(bmp,0,0);
    const data=ctx.getImageData(0,0,bmp.width,bmp.height).data;
    const rgb=new Uint8ClampedArray(bmp.width*bmp.height*3);
    for(let i=0,j=0;i<data.length;i+=4,j+=3){rgb[j]=data[i];rgb[j+1]=data[i+1];rgb[j+2]=data[i+2];}
    state.srcW=bmp.width;state.srcH=bmp.height;state.srcData=rgb;state.finalData=null;
    if(state.originalUrl)URL.revokeObjectURL(state.originalUrl);
    state.originalUrl=URL.createObjectURL(file);$('#img-original').src=state.originalUrl;
    $('#drop-hint').classList.add('hidden');$('#views').classList.remove('hidden');
    toast(`已载入 ${bmp.width}×${bmp.height}`);
    return await renderNow();
  }catch(e){toast('无法载入图片：'+e.message);return false;}
  finally{if(bmp)bmp.close();}
}

/* ============================ 视图 / 缩放 ============================ */
function applyView(){
  const views=$('#views');views.className='views '+state.view;
  $$('#view-mode button').forEach(b=>b.classList.toggle('on',b.dataset.v===state.view));
  applyZoom();
  refreshAccentOverlay();
}
function applyZoom(){
  const oImg=$('#img-original'),rImg=$('#img-result');
  if(!state.outW)return;
  const wrap=$('#canvas-wrap');
  const availH=wrap.clientHeight-60,availW=wrap.clientWidth-60,gap=16;
  let zR,zO;
  if(state.zoom==='fit'){
    if(state.view==='split'){
      const hh=Math.min(availH,(availW-gap)/(state.outW/state.outH+state.srcW/state.srcH));
      zR=hh/state.outH;zO=hh/state.srcH;
    }else if(state.view==='original'){zO=Math.min(availH/state.srcH,availW/state.srcW);zR=zO;}
    else{zR=Math.min(availH/state.outH,availW/state.outW);zO=zR;}
  }else{
    const zi=Number(state.zoom);
    if(state.view==='split'){zR=zi;zO=zi*(state.outH/state.srcH);}
    else{zR=zi;zO=zi;}
  }
  rImg.style.width=state.outW*zR+'px';rImg.style.height=state.outH*zR+'px';
  oImg.style.width=state.srcW*zO+'px';oImg.style.height=state.srcH*zO+'px';
  updateGrid(zR);
}
function updateGrid(z){
  const host=$('#view-result');let grid=host.querySelector('.grid-overlay');
  if(!grid){grid=document.createElement('div');grid.className='grid-overlay';host.appendChild(grid);}
  grid.classList.toggle('hidden',!state.grid||z<3);
  grid.style.backgroundImage='linear-gradient(to right,rgba(124,108,255,.35) 1px,transparent 1px),linear-gradient(to bottom,rgba(124,108,255,.35) 1px,transparent 1px)';
  grid.style.backgroundSize=`${z}px ${z}px`;
}
function tag(v,t){let e=v.querySelector('.tag');if(!e){e=document.createElement('span');e.className='tag';v.appendChild(e);}e.textContent=t;}

/* ============================ 导出 ============================ */
function toCanvas(data,w,h){
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  const ctx=cv.getContext('2d');const id=ctx.createImageData(w,h);
  for(let i=0,j=0;i<data.length;i+=3,j+=4){id.data[j]=data[i];id.data[j+1]=data[i+1];id.data[j+2]=data[i+2];id.data[j+3]=255;}
  ctx.putImageData(id,0,0);return cv;
}
function downloadBlob(blob,name){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function download(cv,name){return new Promise((resolve,reject)=>cv.toBlob(b=>{if(!b){reject(new Error('无法编码 PNG'));return;}downloadBlob(b,name);resolve();},'image/png'));}
function askExportScale(){
  const answer=prompt('放大倍数（1/2/4/8，默认 4）：','4');
  if(answer===null)return null;
  const scale=Number(answer);
  if(!Number.isInteger(scale)||scale<1||scale>8){toast('请输入 1 到 8 的整数倍数');return null;}
  return scale;
}
async function exportCurrent(sc,name){
  const cv=toCanvas(state.finalData,state.outW,state.outH);let output=cv;
  if(sc>1){output=document.createElement('canvas');output.width=state.outW*sc;output.height=state.outH*sc;const cx=output.getContext('2d');cx.imageSmoothingEnabled=false;cx.drawImage(cv,0,0,output.width,output.height);}
  const metadata={tool:`pixcelOE ${TOOL_VERSION}`,version:TOOL_VERSION,params:{...state.params},input_size:[state.srcW,state.srcH],output_size:[state.outW,state.outH],scale:sc,validate:state.report};
  await download(output,`${name}.png`);
  downloadBlob(new Blob([JSON.stringify(metadata,null,2)],{type:'application/json'}),`${name}.json`);
}
async function doExport(){
  if(!state.srcData||state.batching)return;
  const sc=askExportScale();if(sc===null)return;
  if(!await renderNow())return;
  await exportCurrent(sc,`pixel_${Date.now()}`);
  toast('已导出');
}

/* ============================ 绑定 ============================ */
function bind(){
  $('#btn-pick').addEventListener('click',()=>$('#file').click());
  $('#file').addEventListener('change',e=>{
    if(state.batching)return;
    const files=Array.from(e.target.files||[]);if(!files.length)return;
    state.files=files;upload(files[0]);e.target.value='';
    if(files.length>1)toast(`已载入 ${files.length} 张图，可点批量导出`);
  });
  $('#drop-hint').addEventListener('click',e=>{if(e.target.id!=='btn-pick')$('#file').click();});
  window.addEventListener('dragover',e=>e.preventDefault());
  window.addEventListener('drop',e=>{
    e.preventDefault();if(state.batching)return;const files=e.dataTransfer&&e.dataTransfer.files;
    if(files&&files.length){state.files=Array.from(files);upload(files[0]);if(files.length>1)toast(`已载入 ${files.length} 张图`);}
  });
  $('#preset').addEventListener('change',e=>{const p=PRESETS[e.target.value]||customPresets[e.target.value];if(!p)return;state.params={...PRESETS.character,...p};buildControls();scheduleRender();});
  $('#btn-save-preset').addEventListener('click',()=>{
    const answer=prompt('预设名称：','我的预设');if(answer===null||!answer.trim())return;
    const key='custom:'+answer.trim();customPresets[key]={...state.params};
    try{localStorage.setItem('pixceloe_standalone_presets',JSON.stringify(customPresets));}
    catch(e){toast('无法保存预设：'+e.message);return;}
    refreshPresets();$('#preset').value=key;toast('预设已保存');
  });
  $('#btn-reset').addEventListener('click',()=>{$('#preset').value='character';state.params={...PRESETS.character};buildControls();scheduleRender();});
  $('#view-mode').addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    state.view=b.dataset.v;state.zoom='fit';
    $$('#zoom button').forEach(x=>x.classList.toggle('on',x.dataset.z==='fit'));
    applyView();
  });
  $('#zoom').addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    state.zoom=b.dataset.z==='fit'?'fit':Number(b.dataset.z);
    $$('#zoom button').forEach(x=>x.classList.toggle('on',x===b));applyZoom();
  });
  $('#chk-grid').addEventListener('change',e=>{state.grid=e.target.checked;applyZoom();});
  $('#btn-export').addEventListener('click',()=>doExport().catch(e=>toast('导出失败：'+e.message)));
  $('#canvas-wrap').addEventListener('wheel',e=>{
    if(!state.outW)return;e.preventDefault();
    const levels=[1,2,4,8,16];const cur=state.zoom==='fit'?1:state.zoom;
    const next=e.deltaY<0?levels.find(x=>x>cur+0.01):[...levels].reverse().find(x=>x<cur-0.01);
    if(next==null)return;state.zoom=next;
    $$('#zoom button').forEach(b=>b.classList.toggle('on',b.dataset.z===String(next)));
    applyZoom();
  },{passive:false});
  // 左键拖动平移
  const cw=$('#canvas-wrap');let drag=null;
  cw.addEventListener('mousedown',e=>{
    if(e.button!==0)return;if(e.target.closest('button,input,select,.seg'))return;
    drag={x:e.clientX,y:e.clientY,sl:cw.scrollLeft,st:cw.scrollTop};cw.style.cursor='grabbing';e.preventDefault();
  });
  window.addEventListener('mousemove',e=>{if(!drag)return;cw.scrollLeft=drag.sl-(e.clientX-drag.x);cw.scrollTop=drag.st-(e.clientY-drag.y);});
  window.addEventListener('mouseup',()=>{drag=null;cw.style.cursor='';});
  window.addEventListener('resize',()=>applyZoom());
  // 批量导出
  $('#btn-batch').addEventListener('click',async()=>{
    if(state.files.length<=1){toast('请先选择多张图片');return;}
    const sc=askExportScale();if(sc===null)return;
    const files=state.files.slice(),params={...state.params};
    const prefix=`pixel_${Date.now()}`;
    $('#btn-batch').disabled=true;
    const panel=$('.panel');panel.inert=true;
    state.batching=true;
    try{
      for(let i=0;i<files.length;i++){
        state.params={...params};
        if(!await upload(files[i]))throw new Error(`无法转换 ${files[i].name}`);
        await exportCurrent(sc,`${prefix}_${String(i+1).padStart(3,'0')}`);
        toast(`批量 ${i+1}/${files.length}`);
      }
    }catch(e){toast('批量导出失败：'+e.message);}
    finally{state.batching=false;panel.inert=false;$('#btn-batch').disabled=false;}
  });
  window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();if(!state.batching)doExport().catch(err=>toast(err.message));}});
}

/* 初始化 */
let customPresets={};
function refreshPresets(){
  const select=$('#preset');select.querySelectorAll('[data-custom]').forEach(o=>o.remove());
  for(const key of Object.keys(customPresets)){const o=document.createElement('option');o.value=key;o.textContent='★ '+key.slice(7);o.dataset.custom='true';select.appendChild(o);}
}
function init(){
  try{const saved=JSON.parse(localStorage.getItem('pixceloe_standalone_presets')||'{}');if(saved&&typeof saved==='object'&&!Array.isArray(saved))customPresets=saved;}catch{}
  refreshPresets();
  buildControls();
  bind();
  tag($('#view-result'),'成品');
  tag($('#view-original'),'原图');
}
init();
</script>
